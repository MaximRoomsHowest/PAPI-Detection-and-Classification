<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Real-time PAPI (Precision Approach Path Indicator) detection and glidepath classification prototype for Intersoft Electronics Services BV."
    />
    <!-- Matches the night-ops default surface so the browser chrome and the
         first paint don't flash the old navy before the app theme applies. -->
    <meta name="theme-color" content="#0b1016" />
    <!-- Pre-paint background: the app defaults to the dark theme (storage.js),
         so seed <html> dark to avoid a white flash before React mounts. A
         persisted light choice is re-applied by App's theme effect on load. -->
    <style>
      html { background: #0b1016; }
    </style>
    <!-- Share previews (og:image / og:url intentionally omitted: no canonical
         public origin is configured for this prototype). -->
    <meta property="og:title" content="PAPI Vision — Intersoft Electronics" />
    <meta
      property="og:description"
      content="Real-time PAPI (Precision Approach Path Indicator) detection and glidepath classification prototype for Intersoft Electronics Services BV."
    />
    <meta property="og:type" content="website" />
    <title>PAPI Vision — Intersoft Electronics</title>
  </head>
  <body>
    <noscript>
      PAPI Vision needs JavaScript to run the live detection demo. Please enable
      JavaScript in your browser and reload the page.
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
