<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" role="img" aria-label="PAPI Vision">
  <!-- The product's own mark: a PAPI unit's four lamps in their on-glidepath
       signature (2 red + 2 white), matching the in-app PapiGlyph. Dark tile
       matches the app theme-color so it sits cleanly in the browser chrome. -->
  <defs>
    <radialGradient id="lit" cx="50%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="46" height="46" rx="11" fill="#0b1016" stroke="#26303f" stroke-width="1.5"/>
  <g filter="url(#glow)">
    <rect x="5"  y="18" width="8" height="12" rx="2.6" fill="#e5483f"/>
    <rect x="15" y="18" width="8" height="12" rx="2.6" fill="#e5483f"/>
    <rect x="25" y="18" width="8" height="12" rx="2.6" fill="#f4edd8"/>
    <rect x="35" y="18" width="8" height="12" rx="2.6" fill="#f4edd8"/>
  </g>
  <g>
    <rect x="5"  y="18" width="8" height="12" rx="2.6" fill="url(#lit)"/>
    <rect x="15" y="18" width="8" height="12" rx="2.6" fill="url(#lit)"/>
    <rect x="25" y="18" width="8" height="12" rx="2.6" fill="url(#lit)"/>
    <rect x="35" y="18" width="8" height="12" rx="2.6" fill="url(#lit)"/>
  </g>
</svg>
