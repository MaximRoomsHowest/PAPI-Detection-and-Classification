# Full-stack PAPI Detection & Classification — Compose file.
#
# compose.yaml is the modern Compose Specification filename; the obsolete
# top-level `version:` key is intentionally omitted.
#
# Brings up postgres, the FastAPI backend, and the nginx-served frontend
# bundle. The backend model is bind-mounted from ./models so the image stays
# code-only and you can swap weights without rebuilding. The frontend nginx
# reverse-proxies /api + /media to the backend, so the browser talks to a
# single origin (no CORS, tighter CSP — audit DCK-D4).
#
# Quick start (local):
#   cp .env.example .env       # adjust values, especially POSTGRES_PASSWORD
#   docker compose up -d --build
#   open http://localhost:5173
#
# For a real deployment, override at least:
#   POSTGRES_PASSWORD          (strong random secret)
#   PAPI_API_KEY               (required when PAPI_ENV=production)
#   PAPI_ENV=production        (flips the security floor — see backend main.py)
#   PAPI_BACKEND_BIND=0.0.0.0  (only if the API must be reached directly, off-host)

services:
  postgres:
    # Pinned by digest for reproducible builds (audit DCK-D8); tag = 18-alpine.
    # NOTE: a v16 data dir is not readable by a v18 server. On first adoption drop
    # the old demo volume (no migration needed — history is ephemeral demo data):
    #   docker compose down
    #   docker volume rm <project>_papi_postgres_data
    # (`docker compose down -v` also works, but additionally wipes
    # papi_backend_storage — the uploaded originals and annotated exports.)
    image: postgres:18-alpine@sha256:96d56f7f57c6aacd1fcb908bc83b345ec5f83231ee486dd66a1baadce274db88
    container_name: papi-postgres
    environment:
      POSTGRES_DB: papi_backend
      # ${VAR:?msg} fails fast if the variable is missing from .env (audit
      # DCK-MAJ-1: no more hardcoded papi:papi credentials in compose).
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      # Bind to loopback only (audit DCK-CRIT-1: never expose dev postgres
      # on the LAN with default credentials). The backend container reaches
      # postgres via the compose network, not the host port.
      - "127.0.0.1:5434:5432"
    volumes:
      # 18+ images moved PGDATA to /var/lib/postgresql/18/docker and expect the
      # mount one level up at /var/lib/postgresql. Mounting the legacy .../data
      # path makes the server refuse to start on old data — and on an empty
      # volume the real data dir would land in an anonymous volume (no
      # persistence), so do not "fix" this back.
      - papi_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d papi_backend"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # Defense in depth: forbid privilege escalation. cap_drop: ALL is intentionally
    # NOT set here — the official postgres entrypoint drops root via gosu and needs
    # a few caps to chown its data dir on first init.
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backend:
    build:
      context: ./apps/backend
    container_name: papi-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/papi_backend
      PAPI_MODEL_REGISTRY_PATH: /models/serving/models.json
      PAPI_MODEL_PATH: /models/serving/best.pt
      # Optional 3-class transition classifier. Documented in the volumes note below,
      # but previously NOT forwarded into the container, so setting it in .env was a
      # silent no-op (audit IS-2). Empty means "not installed".
      PAPI_TRANSITION_MODEL_PATH: ${PAPI_TRANSITION_MODEL_PATH:-}
      # Default transition derivation when a request sends neither model_id nor
      # transition_method: tracking | model.
      PAPI_TRANSITION_METHOD: ${PAPI_TRANSITION_METHOD:-tracking}
      PAPI_STORAGE_DIR: /storage
      # Model-lifecycle writable stores (upload / datasets / training scratch). These
      # live on dedicated named volumes (see backend.volumes) because ./models is
      # mounted READ-ONLY — uploaded/trained weights and datasets must never touch the
      # git-tracked serving tree.
      PAPI_USER_MODELS_DIR: /user_models
      PAPI_DATASETS_DIR: /datasets
      PAPI_JOBS_DIR: /jobs
      # Read-only source of the committed built-in evaluation datasets. The image
      # build context is apps/backend only, so ./data/eval is bind-mounted (below)
      # and seeded into /datasets on startup as the default per-role eval sets.
      PAPI_EVAL_SEED_DIR: /eval-seed
      PAPI_MAX_MODEL_UPLOAD_MB: ${PAPI_MAX_MODEL_UPLOAD_MB:-500}
      PAPI_MAX_DATASET_UPLOAD_MB: ${PAPI_MAX_DATASET_UPLOAD_MB:-500}
      PAPI_MAX_DATASET_EXTRACT_MB: ${PAPI_MAX_DATASET_EXTRACT_MB:-4000}
      # Training is offloaded ("prepare + run externally"): the app emits a dataset
      # bundle + command the operator runs on their own GPU, then re-imports best.pt.
      PAPI_TRAINING_ENABLED: ${PAPI_TRAINING_ENABLED:-true}
      PAPI_STORAGE_BACKEND: ${PAPI_STORAGE_BACKEND:-local}
      PAPI_BLOB_CONTAINER: ${PAPI_BLOB_CONTAINER:-papi-media}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_STORAGE_ACCOUNT_URL: ${AZURE_STORAGE_ACCOUNT_URL:-}
      # JSON-list form: avoids the pydantic-settings CSV-parse issue that
      # crashed the container in earlier builds (audit SMOKE-CRIT-2). Only used
      # by a direct (non-proxied) frontend such as the Vite dev server — the
      # bundled frontend is same-origin via its nginx proxy and needs no CORS.
      PAPI_CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
      # cpu | cuda | 0 | auto (cuda-if-available). Default cpu; set PAPI_DEVICE=auto
      # in .env to use a GPU when the host and container runtime expose one.
      PAPI_DEVICE: ${PAPI_DEVICE:-cpu}
      PAPI_CONFIDENCE_THRESHOLD: ${PAPI_CONFIDENCE_THRESHOLD:-0.4}
      PAPI_MAX_UPLOAD_MB: ${PAPI_MAX_UPLOAD_MB:-100}
      PAPI_MAX_IMAGE_MEGAPIXELS: ${PAPI_MAX_IMAGE_MEGAPIXELS:-80}
      PAPI_MAX_VIDEO_FRAMES: ${PAPI_MAX_VIDEO_FRAMES:-600}
      PAPI_MAX_VIDEO_SECONDS: ${PAPI_MAX_VIDEO_SECONDS:-150}
      # NOTE: raising this past ~400 MB also requires raising the frontend
      # nginx cap (PAPI_NGINX_MAX_BODY_SIZE on the frontend service below,
      # default 410m — env-templated, no rebuild needed), or proxied uploads
      # die at nginx with a 413 before the backend ever sees them (audit IS-7).
      # The backend's own transport cap follows this value + 10 MB headroom
      # automatically (app/middleware.py).
      PAPI_MAX_BATCH_UPLOAD_MB: ${PAPI_MAX_BATCH_UPLOAD_MB:-400}
      # Aggregate cap on /api/analyze-frames batch size (audit B-MAJ-5).
      # 200 keeps a folder upload of a normal flight under a few minutes
      # of CPU inference; raise via .env if the demo needs a bigger sweep.
      PAPI_MAX_BATCH_FRAMES: ${PAPI_MAX_BATCH_FRAMES:-200}
      # Inference tuning (previously unreachable under compose — audit IS-3).
      # Defaults match app/config.py; imgsz/iou are explicit so a re-exported
      # model can never silently fall back to 640.
      PAPI_SEQUENCE_FPS: ${PAPI_SEQUENCE_FPS:-4}
      PAPI_INFERENCE_IMGSZ: ${PAPI_INFERENCE_IMGSZ:-1280}
      PAPI_INFERENCE_IOU: ${PAPI_INFERENCE_IOU:-0.7}
      # Postgres connection-pool sizing (app/database.py); defaults match
      # app/config.py. SQLite deployments ignore these.
      PAPI_DB_POOL_SIZE: ${PAPI_DB_POOL_SIZE:-10}
      PAPI_DB_MAX_OVERFLOW: ${PAPI_DB_MAX_OVERFLOW:-20}
      # Process-local API throttling. The stricter analyze bucket protects
      # CPU/GPU inference from accidental refresh loops or simple abuse.
      PAPI_RATE_LIMIT_ENABLED: ${PAPI_RATE_LIMIT_ENABLED:-true}
      PAPI_RATE_LIMIT_PER_MINUTE: ${PAPI_RATE_LIMIT_PER_MINUTE:-600}
      PAPI_ANALYZE_RATE_LIMIT_PER_MINUTE: ${PAPI_ANALYZE_RATE_LIMIT_PER_MINUTE:-60}
      # Trust X-Forwarded-For from the in-network nginx proxy so the rate
      # limiter buckets by real client IP instead of lumping every browser
      # user into the proxy's single bucket. uvicorn reads this env natively.
      # "*" is safe in THIS topology: the backend port binds to loopback (see
      # ports below), so only the compose-network proxy and the host itself
      # can connect. Direct host callers could spoof XFF to dodge the limiter
      # — acceptable for the demo threat model; tighten to the proxy IP/CIDR
      # if the port is ever LAN-exposed.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
      # Security floor: ``production`` makes the API key mandatory at startup.
      PAPI_ENV: ${PAPI_ENV:-local}
      PAPI_API_KEY: ${PAPI_API_KEY:-}
      # Optional: cap torch intra-op threads on shared/constrained hosts (audit
      # DCK-D13). Inference is serialized (one analysis at a time), so the
      # default (all cores) is fine on a dedicated host. Uncomment + set in .env
      # to bound it on a shared host:
      # OMP_NUM_THREADS: ${OMP_NUM_THREADS:-}
    ports:
      # Loopback by default so the unauthenticated local API isn't exposed on
      # the LAN (audit DCK-D1) — the frontend reaches it via its nginx proxy.
      # Override PAPI_BACKEND_BIND=0.0.0.0 only for direct off-host API access.
      - "${PAPI_BACKEND_BIND:-127.0.0.1}:8000:8000"
    volumes:
      # The trained serving weight ships committed at models/serving/best.pt
      # (whitelisted in .gitignore), so a clone already has it. Bind mount
      # ./models read-only so you can swap the checkpoint on the host and have
      # the container pick it up without a rebuild.
      - ./models:/models:ro
      # The optional transition classifier is registered at
      # data/runs/detect/transition3class-yolo26s-1280/weights/best.pt, but
      # data/runs is ignored and not mounted here by default. To enable that
      # selector in Docker, add a read-only mount for that run path or copy the
      # weight under ./models and override PAPI_TRANSITION_MODEL_PATH.
      # Runway geometry YAML — read-only. Without this the backend silently
      # falls back to a hardcoded runway copy (audit DCK-D7).
      - ./configs:/app/configs:ro
      # Committed built-in evaluation datasets (data/eval/<id>/), read-only. Seeded
      # into the /datasets volume on startup as the default per-role eval sets.
      - ./data/eval:/eval-seed:ro
      # Uploaded originals + annotated exports persist across container
      # restarts in a named volume.
      - papi_backend_storage:/storage
      # Model-lifecycle writable stores (NOT :ro). Uploaded/trained weights,
      # training datasets, and job scratch live here, off the read-only ./models
      # mount. Named volumes survive `docker compose down` (only `-v` wipes them).
      - papi_user_models:/user_models
      - papi_datasets:/datasets
      - papi_jobs:/jobs
    # uvicorn waits for in-flight requests after SIGTERM, but compose SIGKILLs
    # after 10s by default — mid-flight 150s video analyses died on every
    # `compose restart`. Give them time to finish instead.
    stop_grace_period: 3m
    healthcheck:
      # Readiness via the stdlib (no curl in the slim image). This keeps the
      # frontend from starting until DB + model readiness pass.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    # Defense in depth: the image already runs as the non-root papi user; also
    # forbid privilege escalation and drop all Linux capabilities (audit DCK-D12).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          # Tune to the host; CPU torch inference on a 1280px frame peaks
          # ~2-3 GB (audit DCK-D6). Override via PAPI_BACKEND_MEM_LIMIT in .env.
          memory: ${PAPI_BACKEND_MEM_LIMIT:-4g}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build:
      context: ./apps/frontend
      args:
        # Empty => the bundle uses relative URLs served same-origin by this
        # image's nginx reverse proxy (audit DCK-D4). Set an absolute backend
        # URL only for a direct, non-proxied deployment.
        VITE_PAPI_API_URL: ${FRONTEND_PAPI_API_URL:-}
    container_name: papi-frontend
    environment:
      # Proxy-level request-body cap, rendered into nginx's client_max_body_size
      # by the image's envsubst entrypoint at container start (audit IS-7). Must
      # track PAPI_MAX_BATCH_UPLOAD_MB (+ ~10m multipart headroom) or nginx 413s
      # a legal batch upload before the backend sees it. NEVER name frontend env
      # vars after nginx runtime variables (host, uri, scheme, ...).
      NGINX_CLIENT_MAX_BODY_SIZE: ${PAPI_NGINX_MAX_BODY_SIZE:-410m}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Container listens on 8080 (unprivileged nginx image — audit DCK-MAJ-3).
      # Host port 5173 keeps frontend reachable at the same URL as before.
      - "5173:8080"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  papi_postgres_data:
  papi_backend_storage:
  papi_user_models:
  papi_datasets:
  papi_jobs:
