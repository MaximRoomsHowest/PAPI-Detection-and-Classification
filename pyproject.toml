[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "papi-detection"
version = "0.1.0"
description = "Real-time PAPI detection + per-lamp white/red/transition classification on DJI Matrice 4E drone imagery (Howest x Intersoft)."
requires-python = ">=3.10"
readme = "README.md"
authors = [{ name = "Howest Industry-Project Team" }]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "Pillow>=10.0",
    "exifread>=3.0",
    "pymap3d>=3.0",
    "scipy>=1.11",
    "PyYAML>=6.0",
    "tqdm>=4.66",
    # >=8.4: the project's yolo26 models can be loaded for inference by 8.3.x, but TRAINING
    # (re-parsing the architecture) needs 8.4+ (8.3.x raises SPPF arg-count errors on yolo26).
    "ultralytics>=8.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.15,<0.16",
    "pre-commit>=3.5",
]
# Deps the notebooks import but that aren't needed for the core library/pipeline
# (audit IMP-WF-7). Without these a clean `pip install -e .` cannot run notebooks
# 06/07/08. Install with `pip install -e .[notebooks]`.
notebooks = [
    "onnxruntime>=1.20",
    "opencv-python>=4.10",
    "albumentations>=1.4",
    "matplotlib>=3.8",
    "jupyter>=1.0",
    # Only the data-analysis notebook (05) reads .xlsx via pandas; not a core dep.
    "openpyxl>=3.1",
]
# Optional dependency used by workflows/scripts/edge_benchmark.py for RSS memory
# sampling; it degrades gracefully to None when absent (audit IMP-WF-7).
bench = [
    "psutil>=5.9",
]

[tool.setuptools.packages.find]
where = ["packages/papi/src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# BLE (flake8-blind-except) makes the project's many `# noqa: BLE001` directives
# meaningful and flags any NEW `except Exception` that swallows instead of re-raising,
# so a future blind catch can't silently hide a bug. Deliberate best-effort guards
# carry a justified `# noqa: BLE001`.
select = ["E", "F", "I", "W", "UP", "B", "BLE"]
ignore = ["E501"]  # line-length handled by formatter; allow exceptions

[tool.ruff.lint.per-file-ignores]
# Test modules import a shared pytest fixture by name (e.g. `from test_integration
# import client`) and then take it as a fixture parameter; pyflakes reads the
# parameter as redefining the import (F811). That is the intended pytest pattern.
"apps/backend/tests/*" = ["F811"]

[tool.pytest.ini_options]
testpaths = ["packages/papi/tests"]
addopts = "-ra -q"
